name: Build PBW

on:
  push:
    paths-ignore:
      - 'config-page/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pebble-tool
        run: uv tool install pebble-tool --python 3.13

      - name: Install Pebble SDK
        run: yes | pebble sdk install latest

      - name: Build
        shell: bash
        run: |
          set +e
          pebble build < /dev/null > build.log 2>&1
          status=$?
          cat build.log
          if [ $status -ne 0 ]; then
            # surface the failure as an annotation (readable without sign-in)
            summary=$( (grep -iE "error|fatal|Traceback|failed" build.log | head -25; echo '--- last lines ---'; tail -15 build.log) \
              | sed -e 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=pebble build failed::${summary}"
          fi
          exit $status

      - name: Upload PBW
        uses: actions/upload-artifact@v4
        with:
          name: halcyon-pbw
          path: build/*.pbw
          if-no-files-found: error
